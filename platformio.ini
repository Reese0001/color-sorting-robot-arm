[platformio]
; LEGACY STM32 reference only. Current MSPM0 firmware: python tools/build_firmware.py
src_dir = firmware/src
include_dir = firmware/include

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_src_filter = +<main.cpp> +<servo_arm.cpp>
upload_protocol = stlink
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
